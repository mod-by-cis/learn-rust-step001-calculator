[package]
name = "lekcja003-CalcGui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
tauri = { version = "2.9.1", features = [] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.29.0"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

# Wskazujemy nową lokalizację pliku wykonywalnego
[[bin]]
name = "calc-hybrid"
path = "source/core/main.rs"

[[bin]]
name = "calc-gui"
path = "source/core/gui_only.rs"

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator</title>
    <style>
        /* Reset i blokada przewijania */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Całkowity zakaz paska przewijania */
            background: #1e1e1e;
        }
        /* Zapewnienie, że padding nie zwiększa rozmiaru elementów */
        * {
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="app" style="height: 100%;"></div>
    <script src="bundle.js"></script>
</body>
</html>
